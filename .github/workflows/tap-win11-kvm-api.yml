name: Verify KVM acceleration usable with elevated rights
permissions:
  contents: read
on:
  push:
    branches:
      - review/tap-win11-arm-probe-20261009
    paths:
      - '.github/workflows/tap-win11-kvm-api.yml'
jobs:
  kvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe KVM_GET_API_VERSION and Docker
        shell: bash
        run: |
          set -euo pipefail
          sudo python3 - <<'PY'
          import fcntl, os
          device = '/dev/kvm'
          if not os.path.exists(device):
              raise SystemExit('BLOCKED: /dev/kvm not available')
          fd = os.open(device, os.O_RDWR)
          try:
              api = fcntl.ioctl(fd, 0xAE00)
              print('KVM_API_VERSION='+str(api))
              if api != 12: raise SystemExit('BLOCKED: unexpected KVM API version')
          finally:
              os.close(fd)
          print('KVM_ACCESS_WITH_SUDO=yes')
          PY
          sudo docker version --format 'Docker client={{.Client.Version}} server={{.Server.Version}}'
          echo 'NATIVE_X64_VIRTUALIZATION_HOST=ready'

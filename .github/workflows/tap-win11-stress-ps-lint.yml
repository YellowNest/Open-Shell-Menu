name: Lint native Windows 11 x64 TAP stress PowerShell

permissions:
  contents: read

on:
  push:
    branches:
      - review/tap-win11-arm-probe-20261009
    paths:
      - '.github/workflows/tap-win11-stress-ps-lint.yml'
      - '.github/tap-tests/win11_native_x64_stress.ps1'

jobs:
  powershell-parse:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/tap-win11-arm-probe-20261009
      - name: Parse guest script with Windows PowerShell 5.1 and PowerShell 7
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $path=(Resolve-Path '.github/tap-tests/win11_native_x64_stress.ps1').Path
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count -ne 0) {
            $errors|ForEach-Object {Write-Host $_.ToString()}
            throw "PS7 parser errors: $($errors.Count)"
          }
          Write-Host 'PASS: PowerShell 7 guest stress test parsing'
          $escapedPath = $path.Replace("'","''")
          $testScript = '$t=$null;$e=$null;[System.Management.Automation.Language.Parser]::ParseFile(' + "'" + $escapedPath + "'" + ',[ref]$t,[ref]$e)|Out-Null;if($e.Count -gt 0){$e|ForEach-Object {Write-Host $_.ToString()};exit 1}else{Write-Host "PASS: Windows PowerShell 5.1 parsing"}'
          & powershell.exe -NoProfile -NonInteractive -Command $testScript
          if($LASTEXITCODE -ne 0) {throw "Windows PowerShell 5.1 parser failed: $LASTEXITCODE"}

name: Verify Hardened Open-Shell Installer Transfer to Linux host
permissions:
  contents: read
  actions: read
on:
  push:
    branches:
      - review/tap-win11-arm-probe-20261009
    paths:
      - '.github/workflows/tap-installer-transfer-probe.yml'
jobs:
  artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Download exact tested installer and verify file type
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/installer"
          gh run download 37966360367 -R YellowNest/Open-Shell-Menu -n OpenShellSetup_4_4_202.exe -D "$RUNNER_TEMP/installer"
          find "$RUNNER_TEMP/installer" -type f -maxdepth 2 -printf '%f %s bytes\n'
          f=$(find "$RUNNER_TEMP/installer" -type f -name '*.exe' | head -1)
          test -n "$f"
          file "$f"
          size=$(stat -c '%s' "$f")
          test "$size" -gt 3000000
          echo "PASS: hardened installer artifact accessible from Ubuntu CI host"

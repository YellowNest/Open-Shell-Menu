name: Verify Hardened Open-Shell Installer Transfer to Linux host
permissions:
  contents: read
  actions: read
on:
  push:
    branches:
      - review/tap-win11-arm-probe-20261009
    paths:
      - '.github/workflows/tap-installer-transfer-probe.yml'
jobs:
  artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Download direct uncompressed v7 artifact using compatible v8 action
        uses: actions/download-artifact@v8
        with:
          name: OpenShellSetup_4_4_202.exe
          run-id: 37966360367
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/installer
      - name: Verify PE executable and file size
        shell: bash
        run: |
          set -euo pipefail
          f=$(find "$RUNNER_TEMP/installer" -type f -name '*.exe' | head -1)
          test -n "$f"
          file "$f"
          bytes=$(stat -c '%s' "$f")
          echo "INSTALLER_BYTES=$bytes"
          test "$bytes" -gt 3000000
          python3 - "$f" <<'PY'
          import pathlib,sys
          assert pathlib.Path(sys.argv[1]).open('rb').read(2)==b'MZ'
          print('PASS: real PE installer retrieved in non-zipped form')
          PY
